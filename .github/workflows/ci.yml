
name: Java Tests and Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: investanalyst/investanalyst

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: investanalyst_test
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d investanalyst_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_USERNAME: testuser
      DB_PASSWORD: testpassword
      SPRING_PROFILES_ACTIVE: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: investanalyst/investanalyst/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run tests and generate coverage
        run: ./mvnw --batch-mode clean verify

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-results
          path: |
            investanalyst/investanalyst/target/surefire-reports/
            investanalyst/investanalyst/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14
